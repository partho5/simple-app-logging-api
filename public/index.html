<h1>Simple Logging API</h1>
<p>A minimal logging server backed by Supabase.</p>

<pre>POST /logging/create
Header: x-api-key: &lt;LOG_API_KEY&gt;
Body:   { "identifier_code": "my-app", "log": { ... } }

GET /logging/show?identifier_code=my-app&amp;limit=100</pre>

<p>View logged entries: <a href="/show-logs.html">/show-logs.html</a></p>
